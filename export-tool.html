                const product = productData.find(p => p.lv3 === lv3);
                const lv3Name = product ? product.lv3Name : '';

                // 데이터 내에 쉼표가 있을 수 있으므로 따옴표로 감싸 안전하게 처리합니다.
                const safeLv3 = `"${lv3.replace(/"/g, '""')}"`;
                const safeLv3Name = `"${lv3Name.replace(/"/g, '""')}"`;
                const safeModel = `"${model.replace(/"/g, '""')}"`;

                csvLines.push(`${safeLv3},${safeLv3Name},${safeModel}`);
            });

            const resultCsv = csvLines.join('\n');
            textarea.value = resultCsv;

            statusDiv.innerHTML = `<span class="status-badge success"><i class="fas fa-check-circle"></i> 성공: 총 ${globalModelData.length}개의 모델 데이터가 구글 시트 포맷으로 성공적으로 변환되었습니다!</span>`;
        } catch (e) {
            console.error(e);
            statusDiv.innerHTML = '<span class="status-badge error"><i class="fas fa-times-circle"></i> 변환 처리 중 에러가 발생했습니다.</span>';
        }
    });

    /**
     * 화면에 표시된 CSV 결과를 클립보드에 바로 복사하는 편리한 기능입니다.
     */
    function copyToClipboard() {
        const textarea = document.getElementById('outputTextArea');
        textarea.select();
        document.execCommand('copy');
        alert('전체 데이터가 클립보드에 복사되었습니다! 구글 스프레드시트의 A1 셀을 클릭하고 [Ctrl + V]를 눌러 붙여넣으세요.');
    }

    /**
     * CSV 파일을 로컬 PC로 즉시 다운로드해 주는 기능입니다.
     */
    function convertAndDownload() {
        const textarea = document.getElementById('outputTextArea');
        const csvContent = "\uFEFF" + textarea.value; // MS Excel 한글 깨짐을 방지하기 위한 BOM 추가
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        
        link.setAttribute("href", url);
        link.setAttribute("download", "google_sheets_model_data.csv");
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
